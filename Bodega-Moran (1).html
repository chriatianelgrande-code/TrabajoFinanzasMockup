/* Mora simple diaria sobre cada porción impaga. Cada abono detiene su mora en su fecha.
   El pago abona primero mora acumulada y después cuotas, de la más antigua a la nueva. */
function mora(l,asof=db.today){let rate=(l.moraRate??1)/100/30,total=0;for(let r of l.rows){let events=db.payments.filter(p=>p.lid===l.id&&p.date<=asof).flatMap(p=>p.alloc.filter(a=>a.n===r.n).map(a=>({...a,date:p.date}))).sort((a,b)=>a.date.localeCompare(b.date));let bal=r.payment,prev=r.due;for(let e of events){if(e.date>prev)total+=bal*rate*days(prev,e.date);bal=Math.max(0,bal-e.amount);if(e.date>prev)prev=e.date}total+=bal*rate*days(prev,asof)}let collected=db.payments.filter(p=>p.lid===l.id&&p.date<=asof).reduce((a,p)=>a+p.mora,0);return round(Math.max(0,total-collected))}
function status(l){return debt(l)<=.005&&mora(l)<=.005?'Cancelado':late(l)>0?'En mora':'Al día'}
const badge=s=>`<span class="badge ${s==='En mora'?'red':s==='Cancelado'?'gray':s==='Pendiente'?'amber':''}">${esc(s)}</span>`;

const stat=(label,value,detail,featured=false)=>`<div class="stat ${featured?'featured':''}"><div class="label">${label}${icon('wallet')}</div><strong>${value}</strong><small>${detail}</small></div>`;

function monthlySeries(){let d=parseDate(db.today),months=Array.from({length:chartRange},(_,i)=>{let x=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-chartRange+1+i,1,12));return iso(x).slice(0,7)}),ls=visibleLoans(),ids=new Set(ls.map(l=>l.id));return months.map(m=>({month:m,label:parseDate(m+'-01').toLocaleDateString('es-PE',{month:'short',year:'2-digit',timeZone:'UTC'}),received:round(db.payments.filter(p=>ids.has(p.lid)&&p.date.startsWith(m)&&p.date<=db.today).reduce((s,p)=>s+p.amount,0)),issued:round(ls.filter(l=>l.start.startsWith(m)&&l.start<=db.today).reduce((s,l)=>s+l.principal,0))}))}
function chartPayments(){let data=monthlySeries(),max=Math.max(100,Math.ceil(Math.max(...data.flatMap(x=>[x.received,x.issued]))/100)*100),width=620,left=54,step=(width-left-12)/data.length,bw=Math.min(23,step*.29);return `<svg class="chart" viewBox="0 0 620 240" role="img" aria-label="Pagos recibidos y capital otorgado durante los últimos ${chartRange} meses; montos en soles">${[0,1,2,3,4].map(i=>`<line x1="54" y1="${20+i*44}" x2="610" y2="${20+i*44}" stroke="#e7edf6"/><text x="42" y="${24+i*44}" text-anchor="end" fill="#8392a9" font-size="11">${Math.round(max*(1-i/4))}</text>`).join('')}${data.map((m,i)=>{let x=left+step*(i+.5),h=m.received/max*176,h2=m.issued/max*176;return `<rect x="${x-bw-2}" y="${196-h}" width="${bw}" height="${h}" rx="3" fill="#2858ca"><title>${m.label} · Cobros: ${money(m.received)}</title></rect><rect x="${x+2}" y="${196-h2}" width="${bw}" height="${h2}" rx="3" fill="#aec7f5"><title>${m.label} · Capital otorgado: ${money(m.issued)}</title></rect><text x="${x}" y="224" text-anchor="middle" fill="#74849e" font-size="${data.length>6?9:11}">${esc(m.label)}</text>`}).join('')}</svg>`}

function dashboard(){if(session.role==='client')return clientDashboard();let ls=visibleLoans(),total=round(ls.reduce((s,l)=>s+debt(l),0)),over=round(ls.reduce((s,l)=>s+late(l),0)),notDue=round(total-over),moraTotal=round(ls.reduce((s,l)=>s+mora(l),0)),active=ls.filter(l=>status(l)!=='Cancelado'),month=db.today.slice(0,7),mp=db.payments.filter(p=>p.date.startsWith(month)&&p.date<=db.today),paid=mp.reduce((s,p)=>s+p.amount,0),rows=ls.flatMap(l=>l.rows.filter(r=>r.paid<r.payment-.005).map(r=>({l,r}))).sort((a,b)=>a.r.due.localeCompare(b.r.due)),next=rows.slice(0,5),dueToday=rows.filter(x=>x.r.due===db.today),nextWeek=rows.filter(x=>x.r.due>db.today&&x.r.due<=addDays(db.today,7)),percent=total?100*over/total:0,ranking=db.clients.map(c=>({c,amount:ls.filter(l=>l.cid===c.id).reduce((s,l)=>s+late(l),0)})).filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount).slice(0,4);return head('Resumen financiero','Visibilidad de tu cartera y prioridades de cobranza.',btn('Registrar pago','paymentModal()')+btn('+ Nueva compra',"go('sales')",'primary'))+`<div class="dashboard-meta"><span><b>${esc(db.settings.store)}</b> · Corte de información: ${date(db.today)}</span><span class="metric-note"><span></span>Datos calculados desde compras y pagos registrados</span></div><div class="stats">${stat('Cartera pendiente',money(total),'Cuotas vencidas + por vencer; sin mora',true)}${stat('Cobros del mes',money(paid),mp.length+' pagos · '+parseDate(db.today).toLocaleDateString('es-PE',{month:'long',year:'numeric',timeZone:'UTC'}))}${stat('Cuotas vencidas',money(over),percent.toFixed(1)+'% del saldo pendiente').replace('class="stat "','class="stat alert"')}${stat('Clientes con deuda',new Set(active.map(l=>l.cid)).size,active.length+' créditos activos · '+db.clients.length+' clientes en total')}</div><div class="grid">${chartPanel()}<section class="panel pad"><h2>Composición de la cartera</h2><p class="subtle">Por importe pendiente, sin mora adicional</p><div class="ring" style="background:${total?'c Ordenada por vencimiento · Primero, las más antiguas</p></div>${btn('Ver todas',"go('payments')",'small')}</div>${table(['Cliente','Crédito / cuota','Vencimiento','Pendiente','Estado',''],next.map(({l,r})=>`<tr><td>${person(client(l.cid))}</td><td>${l.id} · ${r.n} de ${l.n}</td><td>${date(r.due)}</td><td><b>${money(r.payment-r.paid)}</b></td><td>${badge(r.due<db.today?'En mora':'Pendiente')}</td><td>${btn('Cobrar',`paymentModal('${l.id}')`,'small')}</td></tr>`))}</section>`}

function clientsView(){return head('Clientes','El cuaderno digital de tus vecinos.',btn('+ Nuevo cliente','clientModal()','primary'))+`<div class="stats">${stat('Clientes',db.clients.length,'Perfiles de demostración')}${stat('Líneas autorizadas',money(db.clients.reduce((s,c)=>s+c.limit,0)),'Límite conjunto')}${stat('Capital utilizado',money(db.clients.reduce((s,c)=>s+exposure(c.id),0)),'Capital y gracia pendientes')}${stat('Con atrasos',new Set(db.loans.filter(l=>late(l)>0).map(l=>l.cid)).size,'Clientes con cuotas vencidas')}</div><section class="panel"><div class="panel-head"><h2>Directorio de clientes</h2></div><div class="filterbar"><input aria-label="Buscar cliente" placeholder="Buscar por nombre o DNI…" oninput="filterRows(this.value,'client-table')"></div><div id="client-table">${table(['Cliente','Línea','Utilizado','Disponible','Créditos / pagos',''],db.clients.map(c=>`<tr><td>${person(c)}</td><td>${money(c.limit)}</td><td>${money(exposure(c.id))}</td><td>${money(Math.max(0,c.limit-exposure(c.id)))}</td><td>${db.loans.filter(l=>l.cid===c.id).length} créditos · ${db.payments.filter(p=>p.cid===c.id).length} pagos</td><td>${btn('Ver cuenta',`clientDetail('${c.id}')`,'small')}</td></tr>`))}</div></section>`}
function filterRows(value,id){let count=0;document.querySelectorAll('#'+id+' tbody tr').forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(value.toLowerCase());if(!r.hidden)count++});let old=document.getElementById(id+'-empty');if(old)old.remove();if(!count)document.getElementById(id).insertAdjacentHTML('beforeend',`<p class="empty" id="${id}-empty">Sin resultados para la búsqueda.</p>`)}
function clientModal(){openModal('Registrar cliente',`<form onsubmit="createClient(event)"><div class="fields"><div class="field full"><label>Nombre completo<input name="name" required maxlength="60"></label></div><div class="field"><label>DNI<input name="dni" required pattern="[0-9]{8}" maxlength="8" inputmode="numeric"></label></div><div class="field"><label>Teléfono<input name="phone" required pattern="[0-9]{9}" maxlength="9" inputmode="numeric"></label></div><div class="field full"><label>Dirección<input name="address" required maxlength="120"></label></div><div class="field"><label>Línea de crédito (S/)<input name="limit" type="number" min="150" max="200" step="0.01" value="150" required></label></div><div class="field full"><label class="check"><input name="consent" type="checkbox" required>Consentimiento de tratamiento de datos registrado (simulado).</label></div></div><p id="form-error" class="error" role="alert"></p><div class="form-footer"><button type="button" onclick="closeModal()">Cancelar</button><button class="primary">Guardar cliente</button></div></form>`)}
function createClient(e){e.preventDefault();if(session?.role==='client')return;let f=Object.fromEntries(new FormData(e.target)),name=f.name.trim();if(!name||db.clients.some(c=>c.dni===f.dni)){$('#form-error').textContent='Ingresa un nombre válido y un DNI que no esté registrado.';return}db.clients.push({id:'C'+String(db.clients.length+1).padStart(3,'0'),name,dni:f.dni,phone:f.phone,address:f.address.trim(),limit:+f.limit,consent:true});save('Cliente registrado: '+name);closeModal();render();toast('Cliente registrado correctamente.')}
function clientDetail(id){if(session.role==='client'&&id!==session.cid)return;selectedClient=id;go('account')}
function loansView(){let ls=visibleLoans();return head(session.role==='client'?'Mis créditos':'Cartera de créditos','Compras financiadas, cuotas e historial de cada operación.',session.role==='client'?'':btn('+ Generar crédito',"go('simulator')",'primary'))+`<section class="panel"><div class="panel-head"><h2>Todos los créditos</h2><span class="badge gray">${ls.length} operaciones</span></div><div class="filterbar"><input aria-label="Buscar crédito" id="loan-query" placeholder="Buscar cliente o código…" oninput="filterLoans()"><select id="loan-state" aria-label="Filtrar por estado" onchange="filterLoans()"><option value="">Todos los estados</option><option>Al día</option><option>En mora</option><option>Cancelado</option></select></div><div id="loans-table">${table(['Crédito',...(session.role!=='client'?['Cliente']:[]),'Capital','Pendiente','Cuotas pagadas','Estado',''],loanRows(ls))}</div></section>${selectedLoan&&ls.some(l=>l.id===selectedLoan)?loanDetail(loan(selectedLoan)):''}`}
function showLoan(id){if(!visibleLoans().some(l=>l.id===id))return;selectedLoan=id;view='loans';render();document.getElementById('loan-detail')?.scrollIntoView({behavior:'smooth'})}
function scheduleTable(calc,showPaid=false){let rows=calc.rows,headers=['N°','TEA','TEP','Gracia','Vencimiento','Saldo inicial','Interés','Cuota','Amortización','Saldo final',...(showPaid?['Pagado','Estado']:[])];let body=[];if(calc.gdays>0)body.push(`<tr class="grace"><td>0</td><td>${pct(calc.tea)}</td><td>${pct(Math.pow(1+calc.im,calc.gdays/30)-1)}</td><td>Total · ${calc.gdays} d</td><td>${date(calc.cut)}</td><td>${money(calc.principal)}</td><td>${money(calc.gi)}</td><td>${money(0)}</td><td>${money(0)}</td><td>${money(calc.financed)}</td>${showPaid?'<td>—</td><td>Capitalizado</td>':''}</tr>`);body.push(...rows.map(r=>`<tr><td>${r.n}</td><td>${pct(calc.tea)}</td><td>${pct(r.ip??calc.ip)}</td><td>Sin gracia</td><td>${date(r.due)}</td><td class="num">${money(r.start)}</td><td class="num negative">${money(r.interest)}</td><td class="num negative">${money(r.payment)}</td><td class="num negative">${money(r.amort)}</td><td class="num">${money(r.end)}</td>${showPaid?`<td>${money(r.paid)}</td><td>${badge(r.paid>=r.payment-.005?'Cancelado':r.due<db.today?'En mora':'Pendiente')}</td>`:''}</tr>`));return table(headers,body,'schedule')+`<div style="padding:15px 20px;display:flex;gap:25px;flex-wrap:wrap;font-size:14px"><span>Interés de cuotas: <b>${money(rows.reduce((s,r)=>s+r.interest,0))}</b></span><span>Gracia capitalizada: <b>${money(calc.gi)}</b></span><span>Total cuotas: <b>${money(calc.total)}</b></span><span>Saldo final: <b>${money(rows.at(-1).end)}</b></span></div>`}
function loanDetail(l){return `<section class="panel" id="loan-detail"><div class="panel-head"><div><span class="eyebrow">DETALLE DEL CRÉDITO ${l.id}</span><h2>${esc(client(l.cid).name)} · Plan de pagos</h2><p>Compra del ${date(l.start)} · ${l.period===7?'Semanal':'Mensual (30 días)'} · ${l.n} cuotas · Método francés vencido</p></div><div class="actions">${btn('CSV',`exportSchedule('${l.id}')`,'small')}${btn('Imprimir','window.print()','small')}${session.role!=='client'&&debt(l)+mora(l)>0?btn('Registrar pago',`paymentModal('${l.id}')`,'primary small'):''}</div></div><div style="padding:0 23px"><div class="summary-row"><span>Precio de venta / inicial / capital</span><b>${money(l.amount)} / ${money(l.amount-l.principal)} / ${money(l.principal)}</b></div><div class="summary-row"><span>Deuda pendiente + mora</span><b>${money(debt(l))} + ${money(mora(l))}</b></div><p class="subtle" style="margin-top:12px">${l.items.length} productos · ${btn('Ver detalle de compra',`purchaseDetail('${l.id}')`,'small')}</p></div>${scheduleTable(l,true)}<div style="padding:20px 23px"><h3>Pagos de este crédito</h3>${table(['Comprobante','Fecha','Medio','Monto','Mora incluida',''],db.payments.filter(p=>p.lid===l.id).map(p=>`<tr><td>${p.id}</td><td>${date(p.date)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${money(p.mora)}</td><td>${btn('Recibo',`receipt('${p.id}')`,'small')}</td></tr>`))}</div></section>`}
function option(v,t,selected){return `<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(t)}</option>`}
function simulatorView(){let c=client(session.cid||selectedClient)||db.clients[0];return head('Plan de pagos','Simula el financiamiento antes de registrarlo.',btn('Ver criterios del proyecto',"go('help')"))+`<div class="split"><section class="panel pad"><span class="eyebrow">01 / DATOS DEL CRÉDITO</span><h2 style="margin:12px 0 20px">Arma un plan claro</h2><form id="sim-form" oninput="updateSimulation()" onchange="updateSimulation()" onsubmit="event.preventDefault();commitSimulation()"><div class="fields"><div class="field full"><label for="sim-client">Cliente</label><select id="sim-client" name="cid">${db.clients.filter(x=>session.role!=='client'||x.id===session.cid).map(x=>option(x.id,x.name,c.id)).join('')}</select></div><div class="field full"><label>Precio de venta (S/)<input name="amount" type="number" min="0.01" max="200" step="0.01" value="100" required></label></div><div class="field"><label>Cuota inicial (%)<input name="initial" type="number" min="0" max="99" step="0.01" value="0" required></label></div><div class="field"><label>Fecha de compra<input name="start" type="date" max="${db.today}" value="${db.today}" required></label></div><div class="field"><label>Frecuencia<select name="period" onchange="this.form.elements.n.value=this.value==='30'?3:12"><option value="7">Semanal · 7 días</option><option value="30">Mensual · 30 días</option></select></label></div><div class="field"><label>Número de cuotas<input name="n" type="number" min="1" max="17" value="12" required></label></div><div class="field"><label>Tipo de tasa<select name="type"><option>EFECTIVA</option><option>NOMINAL</option></select></label></div><div class="field"><label>Tasa mensual (%)<input name="rate" type="number" min="0.0001" max="6.55" step="0.0001" value="${db.settings.rate}" required></label></div><div class="field full" id="cap-field"><label>Capitalización de tasa nominal<select name="cap"><option>Diaria</option><option selected>Mensual</option><option>Anual</option></select></label></div><div class="field"><label>Día de corte<input name="cut" type="number" min="2" max="28" value="${db.settings.cut}" required></label></div><div class="field"><label>Días tras el corte<input name="delay" type="number" min="1" max="15" value="${db.settings.delay}" required></label></div><div class="field full"><label class="check"><input name="grace" type="checkbox" checked>Aplicar gracia total hasta el corte</label><small>El interés de gracia se incorpora al capital.</small></div></div><div class="error" id="sim-error" role="alert"></div>${session.role==='client'?'<div class="notice">Esta simulación no crea una deuda. Solicita el crédito en la bodega.</div>':'<button class="primary" style="width:100%" id="commit-sim">Registrar crédito de ejemplo</button>'}</form></section><div id="sim-result"></div></div>`}
function readSimulation(){let f=Object.fromEntries(new FormData($('#sim-form')));for(let k of ['amount','initial','period','n','rate','cut','delay'])f[k]=+f[k];f.grace=!!f.grace;return f}
function validatePlan(p,checkLine=true){if(!client(p.cid))return 'Selecciona un cliente válido.';if(!Number.isFinite(p.initial))return 'Revisa la cuota inicial.';if(!['EFECTIVA','NOMINAL'].includes(p.type)||!['Diaria','Mensual','Anual'].includes(p.cap))return 'Selecciona una tasa y capitalización válidas.';if(!Number.isFinite(p.amount)||p.amount<=0||!Number.isFinite(p.rate)||p.rate<=0||p.rate>6.55||p.initial<0||p.initial>=100)return 'Revisa el importe, la inicial y la tasa (mayor que 0 y hasta 6.55%).';if(!Number.isInteger(p.n)||p.n<1||p.n>17||![7,30].includes(p.period))return 'Ingresa entre 1 y 17 cuotas enteras y una frecuencia válida.';if(!p.start||p.start>db.today)return 'La fecha de compra no puede ser futura.';if(p.cut<2||p.cut>28||!Number.isInteger(p.cut)||p.delay<1||p.delay>15||!Number.isInteger(p.delay))return 'Corte: 2 a 28. Días de pago: 1 a 15.';let calc=buildSchedule(p);if(calc.rows.some(r=>r.payment<=0||r.amort<0))return 'El monto es demasiado pequeño para ese número de cuotas. Reduce las cuotas.';if(calc.im>.0655+1e-10)return 'La tasa efectiva mensual equivalente supera el límite académico de 6.55%.';if(days(p.start,calc.rows.at(-1).due)>db.settings.maxdays)return 'El último vencimiento excede '+db.settings.maxdays+' días desde la compra. Reduce cuotas o días al corte.';if(checkLine&&calc.financed>round(client(p.cid).limit-exposure(p.cid)))return 'El capital más la gracia excede la línea disponible de '+money(Math.max(0,client(p.cid).limit-exposure(p.cid)))+'.';return ''}
function updateSimulation(){let p=readSimulation();$('#cap-field').hidden=p.type!=='NOMINAL';let error=validatePlan(p),valid=$('#sim-form').checkValidity();$('#sim-error').textContent=error||(!valid?'Completa todos los campos con valores válidos.':'');if($('#commit-sim'))$('#commit-sim').disabled=!!error||!valid;if(!valid||!p.n||p.n>100){simulation=null;$('#sim-result').innerHTML='<div class="panel pad"><h2>Completa los datos del crédito</h2><p class="subtle">El cronograma aparecerá aquí.</p></div>';return}let calc=buildSchedule(p);simulation={...p,...calc};let available=Math.max(0,client(p.cid).limit-exposure(p.cid));$('#sim-result').innerHTML=`<section class="hero-account"><span class="eyebrow" style="color:#547bbb">02 / TU CUOTA ${p.period===7?'SEMANAL':'MENSUAL'}</span><div class="big-total">${money(calc.rows[0].payment)}</div><p class="subtle">${p.n} cuotas · Primera fecha: ${date(calc.rows[0].due)}</p><div class="summary-row"><span>Capital financiado</span><b>${money(calc.principal)}</b></div><div class="summary-row"><span>Gracia capitalizada</span><b>${money(calc.gi)} · ${calc.gdays} días comerciales</b></div><div class="summary-row"><span>Costo financiero total</span><b>${money(calc.total-calc.principal)}</b></div><div class="summary-row"><span>Total cuotas + inicial</span><b>${money(calc.total+p.amount-calc.principal)}</b></div></section><div class="notice ${error?'warn':''}">${error?esc(error):`Disponible del cliente: <b>${money(available)}</b>. El saldo se actualizará al registrar.`}</div><section class="panel"><div class="panel-head"><div><h2>Cronograma de pagos</h2><p>Columnas basadas en tu imagen de referencia</p></div>${btn('CSV','exportSimulation()','small')}</div>${scheduleTable(calc)}<div style="padding:0 20px 20px"><p class="subtle">TEM ${pct(calc.im)} · TEA ${pct(calc.tea)} · TEP ${pct(calc.ip)}. La última cuota ajusta centavos para cerrar el saldo en cero.</p><p class="subtle">La primera cuota vence ${p.delay} días después del corte y usa la tasa equivalente de esos días. El resto usa la TEP ${p.period===7?'semanal':'mensual'}. La cuota constante se ajusta por ese primer intervalo.</p></div></section>`}
function commitSimulation(){if(session.role==='client'||!simulation)return;let err=validatePlan(simulation);if(err){toast(err);return}openModal('Confirmar crédito simulado',`<p>Registrarás un crédito de <b>${money(simulation.principal)}</b> para <b>${esc(client(simulation.cid).name)}</b>.</p><div class="summary-row"><span>Plan</span><b>${simulation.n} cuotas de ${money(simulation.rows[0].payment)}</b></div><div class="summary-row"><span>Último vencimiento</span><b>${date(simulation.rows.at(-1).due)}</b></div><div class="notice">Este registro de ejemplo representa una compra fiada de abarrotes, sin salida real de dinero.</div><div class="form-footer">${btn('Volver','closeModal()')}${btn('Confirmar crédito','confirmSimulation()','primary')}</div>`)}
function insertLoan(p,items){if(!session||session.role==='client')throw Error('Operación no permitida');let error=validatePlan(p);if(error)throw Error(error);let calc=buildSchedule(p),id='CR-'+String(db.loans.length+1).padStart(3,'0'),l={id,...p,...calc,items,source:items.every(i=>i.pid)?'catalog':'simulation',moraRate:db.settings.mora,created:db.today};db.loans.push(l);if(p.initial>0){let amount=round(p.amount-calc.principal);db.payments.push({id:'PG-'+String(db.payments.length+1).padStart(3,'0'),lid:id,cid:p.cid,date:p.start,amount,mora:0,method:'Inicial',alloc:[],by:session.name})}save('Crédito '+id+' generado para '+client(p.cid).name);selectedLoan=id;return l}
function confirmSimulation(){if(!simulation||validatePlan(simulation))return;insertLoan(simulation,[{name:'Compra de abarrotes (simulada)',qty:1,price:simulation.amount}]);closeModal();view='loans';simulation=null;render();toast('Crédito registrado y cronograma generado.')}
function salesView(){return head('Nueva compra fiada','Registra productos y convierte la compra en un plan de pagos.')+`<div class="grid"><div><section class="panel pad"><label>Cliente<select id="sale-client" onchange="selectedClient=this.value;refreshCart()">${db.clients.map(c=>option(c.id,c.name,selectedClient)).join('')}</select></label><p class="subtle" id="sale-available"></p><div class="fields"><label>Buscar producto<input id="sale-search" placeholder="Nombre o código…" oninput="filterCatalog()"></label><label>Categoría<select id="sale-category" onchange="filterCatalog()"><option value="">Todas las categorías</option>${categories().map(c=>option(c,c,'')).join('')}</select></label></div><p id="catalog-count" class="subtle" style="margin:12px 0 0">${db.products.length} productos disponibles en el catálogo</p></section><div class="product-grid" id="sale-products">${db.products.map(p=>`<article class="product" data-name="${esc(p.name+' '+p.id)}" data-category="${esc(p.category)}"><div class="product-icon">${icon('bag')}</div><span class="eyebrow" style="font-size:10px">${p.category}</span><h3>${esc(p.name)}</h3><div class="summary-row"><span>Contado</span><b>${money(p.cash)}</b></div><div class="summary-row"><span>Al crédito</span><b>${money(p.credit)}</b></div><small>${p.stock} unidades disponibles</small><button type="button" class="small" onclick="addCart('${p.id}')" ${p.stock<=0?'disabled':''}>${p.stock<=0?'Agotado':'+ Agregar'}</button></article>`).join('')}</div></div><section class="panel pad cart-panel"><span class="eyebrow">RESUMEN DE COMPRA</span><h2 style="margin:10px 0 20px">Canasta del cliente</h2><div id="cart-items"></div><form id="sale-form" onsubmit="checkout(event)"><div class="fields"><div class="field"><label>Frecuencia<select name="period" onchange="this.form.elements.n.value=this.value==='30'?3:12"><option value="7">Semanal</option><option value="30">Mensual</option></select></label></div><div class="field"><label>Cuotas<input name="n" value="12" min="1" max="17" type="number" required></label></div></div><div class="notice">TEM ${db.settings.rate}% · Gracia al corte ${db.settings.cut} · Primer vencimiento ${db.settings.delay} días después del corte.</div><button class="primary" style="width:100%">Revisar compra y plan</button><p id="sale-error" class="error" role="alert"></p></form></section></div>`}
function addCart(id){if(!session||session.role==='client')return;let p=db.products.find(x=>x.id===id),item=cart.find(x=>x.id===id);if((item?.qty||0)>=p.stock)return toast('No hay más unidades disponibles.');if(item)item.qty++;else cart.push({id,qty:1});refreshCart()}
function adjustCart(id,delta){let item=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(item.qty+delta>p.stock)return toast('Stock insuficiente.');item.qty+=delta;cart=cart.filter(x=>x.qty>0);refreshCart()}
function cartTotal(){return round(cart.reduce((s,i)=>s+i.qty*db.products.find(p=>p.id===i.id).credit,0))}
function refreshCart(){if(!$('#cart-items'))return;let cid=$('#sale-client').value;selectedClient=cid;$('#sale-available').textContent='Línea disponible: '+money(Math.max(0,client(cid).limit-exposure(cid)));$('#cart-items').innerHTML=cart.length?cart.map(i=>{let p=db.products.find(x=>x.id===i.id);return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b style="font-size:14px">${esc(p.name)}</b><div class="summary-row" style="border:0"><span>${btn('−',`adjustCart('${i.id}',-1)`,'small')} <b style="margin:0 8px">${i.qty}</b> ${btn('+',`adjustCart('${i.id}',1)`,'small')}</span><b>${money(i.qty*p.credit)}</b></div></div>`}).join('')+`<div class="summary-row"><b>Total al crédito</b><b>${money(cartTotal())}</b></div>`:'<div class="empty">Tu canasta está vacía.<br>Agrega productos para comenzar.</div>'}
let pendingSale=null;
function checkout(e){e.preventDefault();if(!cart.length){$('#sale-error').textContent='Agrega al menos un producto.';return}let f=Object.fromEntries(new FormData(e.target)),p={cid:selectedClient,amount:cartTotal(),initial:0,start:db.today,period:+f.period,n:+f.n,type:'EFECTIVA',rate:db.settings.rate,cap:'Mensual',grace:true,cut:db.settings.cut,delay:db.settings.delay},error=validatePlan(p);if(error){$('#sale-error').textContent=error;return}pendingSale=p;let calc=buildSchedule(p);openModal('Revisar compra fiada',`<p><b>${esc(client(p.cid).name)}</b> · ${cart.reduce((s,x)=>s+x.qty,0)} unidades</p><div class="summary-row"><span>Importe de productos</span><b>${money(p.amount)}</b></div><div class="summary-row"><span>Gracia capitalizada</span><b>${money(calc.gi)}</b></div><div class="summary-row"><span>Plan</span><b>${p.n} cuotas · ${money(calc.rows[0].payment)}</b></div><div class="summary-row"><span>Total a pagar</span><b>${money(calc.total)}</b></div><div class="summary-row"><span>Primer / último vencimiento</span><b>${date(calc.rows[0].due)}<br>${date(calc.rows.at(-1).due)}</b></div><div class="form-footer">${btn('Volver','closeModal()')}${btn('Confirmar compra','confirmSale()','primary')}</div>`)}
function confirmSale(){if(!pendingSale||session?.role==='client')return;let validation=validatePlan(pendingSale);if(validation)return toast(validation);if(round(cartTotal())!==pendingSale.amount)return toast('La canasta cambió. Revisa la compra nuevamente.');for(let i of cart){if(i.qty>db.products.find(p=>p.id===i.id).stock)return toast('Stock insuficiente. Revisa la compra.')}let items=cart.map(i=>{let p=db.products.find(p=>p.id===i.id);p.stock-=i.qty;db.inventory.unshift({date:db.today,pid:p.id,name:p.name,delta:-i.qty,reason:'Compra fiada '+('CR-'+String(db.loans.length+1).padStart(3,'0')),user:session.name});return {pid:p.id,name:p.name,category:p.category,qty:i.qty,price:p.credit}});insertLoan(pendingSale,items);pendingSale=null;cart=[];closeModal();view='loans';render();toast('Compra registrada. Stock y cuenta del cliente actualizados.')}
function paymentsView(){let ls=visibleLoans(),ids=ls.map(l=>l.id),ps=db.payments.filter(p=>ids.includes(p.lid)).slice().reverse(),over=ls.filter(l=>late(l)>0);return head(session.role==='client'?'Mis pagos':'Pagos y cobranza','Abonos, comprobantes y obligaciones pendientes.',session.role!=='client'?btn('+ Registrar pago','paymentModal()','primary'):'')+`<div class="stats">${stat('Abonos registrados',money(ps.reduce((s,p)=>s+p.amount,0)),ps.length+' comprobantes',true)}${stat('Cuotas vencidas',money(ls.reduce((s,l)=>s+late(l),0)),over.length+' créditos con atraso')}${stat('Mora pendiente',money(ls.reduce((s,l)=>s+mora(l),0)),'Tasa demo: '+db.settings.mora+'% mensual simple')}${stat('Deuda total',money(ls.reduce((s,l)=>s+debt(l)+mora(l),0)),'Incluye cuotas futuras y mora')}</div>${over.length?`<section class="panel"><div class="panel-head"><h2>Créditos que necesitan atención</h2></div>${table(['Crédito','Cliente','Vencido','Mora',''],over.map(l=>`<tr><td>${l.id}</td><td>${esc(client(l.cid).name)}</td><td>${money(late(l))}</td><td>${money(mora(l))}</td><td>${btn(session.role==='client'?'Ver plan':'Cobrar',session.role==='client'?`showLoan('${l.id}')`:`paymentModal('${l.id}')`,'small')}</td></tr>`))}</section>`:''}<section class="panel"><div class="panel-head"><div><h2>Historial de pagos</h2><p>Los pagos parciales se aplican a las cuotas más antiguas.</p></div>${btn('Exportar CSV','exportPayments()','small')}</div><div class="filterbar"><input aria-label="Buscar pago" placeholder="Buscar cliente, comprobante o medio de pago…" oninput="filterRows(this.value,'payments-table')"></div><div id="payments-table">${table(['Recibo','Cliente','Fecha','Medio','Abono','Mora incluida',''],ps.map(p=>`<tr><td>${p.id}<div class="subtle">${p.lid}</div></td><td>${esc(client(p.cid).name)}</td><td>${date(p.date)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${money(p.mora)}</td><td>${btn('Comprobante',`receipt('${p.id}')`,'small')}</td></tr>`))}</div></section>`}
function paymentModal(id){if(session.role==='client')return;let ls=db.loans.filter(l=>debt(l)+mora(l)>.005);if(!ls.length)return toast('No hay créditos pendientes.');let selected=id||ls[0].id;openModal('Registrar pago',`<form onsubmit="recordPayment(event)"><div class="fields"><div class="field full"><label>Crédito<select id="pay-loan" name="lid" onchange="paymentInfo()">${ls.map(l=>option(l.id,l.id+' · '+client(l.cid).name,selected)).join('')}</select></label></div><div class="field full" id="pay-info"></div><div class="field"><label>Monto (S/)<input id="pay-amount" name="amount" type="number" min="0.01" step="0.01" required></label></div><div class="field"><label>Fecha de pago<input name="date" type="date" value="${db.today}" min="${db.today}" max="${db.today}" required readonly></label><small>Se registra en la fecha de la demostración.</small></div><div class="field full"><label>Medio de pago<select name="method"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option></select></label></div></div><div class="notice">Aplicación: mora pendiente primero, después cuotas por antigüedad. Un abono parcial reduce el saldo impago. No hay procesamiento bancario.</div><p class="error" id="pay-error" role="alert"></p><div class="form-footer">${btn('Cancelar','closeModal()')}<button class="primary">Confirmar pago simulado</button></div></form>`);paymentInfo()}
function paymentInfo(){let l=loan($('#pay-loan').value),total=round(debt(l)+mora(l)),next=l.rows.find(r=>r.paid<r.payment-.005);$('#pay-info').innerHTML=`<div class="summary-row"><span>Cuotas pendientes</span><b>${money(debt(l))}</b></div><div class="summary-row"><span>Mora acumulada</span><b>${money(mora(l))}</b></div><div class="summary-row"><span>Deuda total</span><b>${money(total)}</b></div>`;$('#pay-amount').max=total;$('#pay-amount').value=round(Math.min(total,(next?next.payment-next.paid:0)+mora(l)))}
function recordPayment(e){e.preventDefault();if(!session||session.role==='client')return;let f=Object.fromEntries(new FormData(e.target)),l=loan(f.lid),amount=round(+f.amount),total=round(debt(l)+mora(l));if(!Number.isFinite(amount)||amount<=0||amount>total||f.date!==db.today){$('#pay-error').textContent='El abono debe ser mayor que cero y no exceder la deuda total.';return}let m=Math.min(amount,mora(l)),remaining=round(amount-m),alloc=[];for(let r of l.rows){let applied=round(Math.min(remaining,r.payment-r.paid));if(applied>0){r.paid=round(r.paid+applied);remaining=round(remaining-applied);alloc.push({n:r.n,amount:applied})}}let p={id:'PG-'+String(db.payments.length+1).padStart(3,'0'),lid:l.id,cid:l.cid,date:f.date,amount,mora:m,method:f.method,alloc,by:session.name};db.payments.push(p);save('Pago '+p.id+' registrado: '+money(amount));closeModal();render();receipt(p.id);toast('Pago registrado. Los saldos y reportes están actualizados.')}
function receipt(id){let p=db.payments.find(p=>p.id===id);if(!p||(session.role==='client'&&p.cid!==session.cid))return;openModal('Comprobante '+p.id,`<div style="text-align:center"><div class="receipt-logo"><svg class="moran-logo" viewBox="0 0 48 48" role="img" aria-label="Logotipo Bodega Morán"><rect x="1" y="1" width="46" height="46" rx="12" fill="#2858ca"/><path d="M11 34V15h5l8 10 8-10h5v19h-6V24l-7 8-7-8v10Z" fill="white"/><path d="M13 10h22" stroke="#9fbdff" stroke-width="2" stroke-linecap="round"/></svg></div><span class="eyebrow">${esc(db.settings.store)}</span><h2 style="margin:12px 0">Constancia de pago</h2><p class="subtle">Comprobante simulado · Sin validez tributaria</p><div class="big-total">${money(p.amount)}</div>${badge('Registrado')}</div><div class="summary-row"><span>Cliente</span><b>${esc(client(p.cid).name)}</b></div><div class="summary-row"><span>Crédito / fecha</span><b>${p.lid} · ${date(p.date)}</b></div><div class="summary-row"><span>Medio de pago</span><b>${esc(p.method)}</b></div><div class="summary-row"><span>Mora pagada</span><b>${money(p.mora)}</b></div><div class="summary-row"><span>${p.method==='Inicial'?'Cuota inicial':'Abono a cuotas'}</span><b>${money(p.amount-p.mora)}</b></div><div class="summary-row"><span>Registrado por</span><b>${esc(p.by)}</b></div>${p.alloc.length?`<h3 style="margin-top:20px">Distribución del abono</h3>${table(['Cuota','Monto abonado'],p.alloc.map(a=>`<tr><td>${a.n}</td><td>${money(a.amount)}</td></tr>`))}`:''}<div class="form-footer">${btn('Imprimir / Guardar PDF','window.print()','primary')}</div>`)}
function productsView(){return head('Productos e inventario','Precios referenciales de demostración y stock disponible.',session.role==='admin'?btn('+ Nuevo producto','productModal()','primary'):'')+`<div class="stats stock-summary">${stat('Productos',db.products.length,categories().length+' categorías')}${stat('Unidades disponibles',db.products.reduce((s,p)=>s+p.stock,0),'Existencias actuales del catálogo',true)}${stat('Stock bajo',db.products.filter(p=>p.stock>0&&p.stock<10).length,'Entre 1 y 9 unidades')}${stat('Agotados',db.products.filter(p=>p.stock===0).length,'No se pueden agregar a una compra')}</div><section class="panel"><div class="panel-head"><h2>Catálogo completo</h2><span class="badge gray" id="product-count">${db.products.length} productos</span></div><div class="filterbar"><input id="product-query" aria-label="Buscar producto" placeholder="Nombre o código…" oninput="filterProducts()"><select id="product-category" aria-label="Categoría" onchange="filterProducts()"><option value="">Todas las categorías</option>${categories().map(c=>option(c,c,'')).join('')}</select><select id="product-state" aria-label="Estado de stock" onchange="filterProducts()"><option value="">Todos los estados</option>${['Disponible','Stock bajo','Agotado'].map(c=>option(c,c,'')).join('')}</select></div><div id="product-table">${productsTable(db.products)}</div></section><section class="panel"><div class="panel-head"><div><h2>Movimientos de inventario</h2><p>Últimos 20 ingresos, ajustes y salidas registrados en la demo.</p></div></div>${inventoryTable()}</section><div class="notice">Las existencias iniciales son un saldo de apertura de ejemplo. Las nuevas compras generan salidas y las reposiciones generan ingresos; editar el stock registra un ajuste.</div>`}
function productModal(id){if(session.role!=='admin')return;let p=db.products.find(p=>p.id===id)||{name:'',category:'Abarrotes',cash:1,credit:1,stock:0};openModal(id?'Editar producto':'Nuevo producto',`<form onsubmit="saveProduct(event,'${id||''}')"><div class="fields"><div class="field full"><label>Nombre<input name="name" value="${esc(p.name)}" maxlength="50" required></label></div><div class="field full"><label>Categoría<select name="category">${['Abarrotes','Lácteos','Frescos','Limpieza','Bebidas','Higiene','Snacks'].map(x=>option(x,x,p.category)).join('')}</select></label></div><div class="field"><label>Precio contado (S/)<input name="cash" type="number" step=".01" min=".01" value="${p.cash}" required></label></div><div class="field"><label>Precio crédito (S/)<input name="credit" type="number" step=".01" min=".01" value="${p.credit}" required></label></div><div class="field"><label>Stock<input name="stock" type="number" min="0" step="1" value="${p.stock}" required></label></div></div><div class="form-footer">${btn('Cancelar','closeModal()')}<button class="primary">Guardar producto</button></div></form>`)}
function saveProduct(e,id){e.preventDefault();if(session.role!=='admin')return;let f=Object.fromEntries(new FormData(e.target));if(!f.name.trim()||!Number.isFinite(+f.cash)||+f.cash<=0||!Number.isFinite(+f.credit)||+f.credit<=0||!Number.isInteger(+f.stock)||+f.stock<0)return toast('Revisa nombre, precios positivos y stock entero.');let previous=id?db.products.find(x=>x.id===id):null;let p={id:id||nextProductId(),name:f.name.trim(),category:f.category,cash:round(+f.cash),credit:round(+f.credit),stock:+f.stock};if((previous?.stock||0)!==p.stock)db.inventory.unshift({date:db.today,pid:p.id,name:p.name,delta:p.stock-(previous?.stock||0),reason:id?'Ajuste de inventario':'Alta de producto',user:session.name});if(id)Object.assign(db.products.find(x=>x.id===id),p);else db.products.push(p);save('Producto actualizado: '+p.name);closeModal();render();toast('Catálogo actualizado.')}
function reportsView(){let ls=db.loans,capitalTotal=ls.reduce((s,l)=>s+l.principal,0),interest=ls.reduce((s,l)=>s+l.total-l.principal,0),collected=db.payments.reduce((s,p)=>s+p.amount,0),brackets=[['1–7 días',1,7],['8–15 días',8,15],['16–30 días',16,30],['Más de 30',31,99999]],aging=brackets.map(([label,min,max])=>({label,value:ls.reduce((s,l)=>s+l.rows.filter(r=>{let d=days(r.due,db.today);return d>=min&&d<=max}).reduce((t,r)=>t+r.payment-r.paid,0),0)})),max=Math.max(1,...aging.map(a=>a.value));return head('Reportes de la bodega','Cartera, cobranza e historial consolidado.',btn('Descargar resumen','exportReport()')+btn('Imprimir','window.print()','primary'))+`<div class="stats">${stat('Capital otorgado',money(capitalTotal),'Acumulado de créditos',true)}${stat('Interés contractual',money(interest),'Programado en todos los créditos; no cobrado')}${stat('Cobros acumulados',money(collected),'Incluye capital, interés y mora pagada')}${stat('Mora cobrada',money(db.payments.reduce((s,p)=>s+p.mora,0)),'Incluida en cobros acumulados')}</div><div class="grid">${chartPanel()}<section class="panel pad"><span class="eyebrow">RIESGO DE CARTERA</span><h2 style="margin-top:9px">Antigüedad de los atrasos</h2><p class="subtle">Importe de cuotas impagas, sin mora adicional.</p>${aging.map(a=>`<div class="bar-row"><span>${a.label}</span><div class="bar"><i style="width:${a.value/max*100}%"></i></div><b>${money(a.value)}</b></div>`).join('')}</section></div><section class="panel"><div class="panel-head"><h2>Resumen por cliente</h2></div>${table(['Cliente','Créditos','Pagos','Abonado','Capital usado','Cuotas pendientes','Mora'],db.clients.map(c=>{let ll=ls.filter(l=>l.cid===c.id),pp=db.payments.filter(p=>p.cid===c.id);return `<tr><td>${esc(c.name)}</td><td>${ll.length}</td><td>${pp.length}</td><td>${money(pp.reduce((s,p)=>s+p.amount,0))}</td><td>${money(exposure(c.id))}</td><td>${money(ll.reduce((s,l)=>s+debt(l),0))}</td><td>${money(ll.reduce((s,l)=>s+mora(l),0))}</td></tr>`}))}</section><div class="grid equal">${categorySales()}${inventorySummary()}</div><div class="notice">Los indicadores muestran gestión de créditos. No representan ganancias netas: este prototipo no registra costos de mercadería, gastos ni contabilidad completa.</div>`}
function settingsView(){return head('Configuración','Parámetros de nuevas operaciones y control de la demostración.')+`<div class="grid equal"><section class="panel pad"><h2>Reglas de la bodega</h2><form onsubmit="saveSettings(event)"><div class="fields" style="margin-top:20px"><div class="field full"><label>Nombre comercial<input name="store" value="${esc(db.settings.store)}" required maxlength="50"></label></div><div class="field"><label>TEM por defecto (%)<input name="rate" type="number" min=".0001" max="6.55" step=".0001" value="${db.settings.rate}" required></label></div><div class="field"><label>Mora mensual (%)<input value="${db.settings.mora}" disabled></label><small>Fija en 1% para los registros demo.</small></div><div class="field"><label>Día de corte<input name="cut" type="number" min="2" max="28" value="${db.settings.cut}" required></label></div><div class="field"><label>Días de pago<input name="delay" type="number" min="1" max="15" value="${db.settings.delay}" required></label></div><div class="field full"><label>Plazo máximo desde la compra<select name="maxdays">${[90,120].map(d=>option(String(d),d+' días',String(db.settings.maxdays))).join('')}</select></label></div></div><p class="subtle" style="margin-top:16px">Los cambios aplican a nuevos créditos. Los cronogramas ya registrados se conservan.</p><button class="primary">Guardar parámetros</button></form></section><section class="panel pad"><h2>Fecha de la demostración</h2><p class="subtle">Avanza la fecha para observar vencimientos y mora. No se permiten retrocesos para mantener coherente el historial.</p><form onsubmit="changeDate(event)"><label>Fecha actual<input name="today" type="date" min="${db.today}" value="${db.today}" required></label><button style="margin-top:14px">Aplicar fecha</button></form><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h2>Datos de ejemplo</h2><p class="subtle">Puedes descargar una copia JSON o reiniciar todos los cambios locales.</p><div class="actions">${btn('Descargar respaldo','backup()')}${btn('Restablecer demo','resetConfirm()','danger')}</div></section></div><section class="panel pad"><h2>Actividad reciente</h2><div class="timeline" style="margin-top:20px">${db.audit.slice(0,15).map(a=>`<p>${esc(a.text)}<small>${date(a.date)} · ${esc(a.user)}</small></p>`).join('')}</div></section>`}
function saveSettings(e){e.preventDefault();if(session.role!=='admin')return;let f=Object.fromEntries(new FormData(e.target));if(!f.store.trim())return toast('Escribe el nombre de la bodega.');Object.assign(db.settings,{store:f.store.trim(),rate:+f.rate,cut:+f.cut,delay:+f.delay,maxdays:+f.maxdays});save('Parámetros de nuevos créditos actualizados');render();toast('Configuración guardada.')}
function changeDate(e){e.preventDefault();if(session?.role!=='admin')return;let d=new FormData(e.target).get('today');if(d<db.today)return;db.today=d;save('Fecha demo avanzada');render();toast('Vencimientos y mora recalculados.')}
function resetConfirm(){openModal('Restablecer datos de ejemplo',`<p>Se eliminarán las compras, clientes, productos y pagos que agregaste a esta demostración. Se recuperarán los datos iniciales.</p><div class="form-footer">${btn('Cancelar','closeModal()')}${btn('Sí, restablecer','resetDemo()','danger')}</div>`)}
function resetDemo(){if(session.role!=='admin')return;db=upgradeData(seed());purchaseFilters={query:'',cid:'',state:'',from:'',to:''};cart=[];selectedClient='C001';selectedLoan='CR-001';save();closeModal();render();toast('Datos de demostración restablecidos.')}
function helpView(){return head('Guía del proyecto','Alcance, fórmulas y decisiones del prototipo basado en tu documento.')+`<div class="help-grid"><section class="panel pad"><h2>Cómo explorar la aplicación</h2><p>El catálogo incluye 50 productos de ejemplo. Historial de compras muestra los artículos, cantidades, precio pactado y deuda; Estado de cuenta reúne todas las compras y pagos de un cliente. Los precios históricos se conservan aunque se edite el catálogo.</p><ol><li>Ingresa como <b>admin / demo123</b> y revisa el resumen.</li><li>En Clientes, consulta el historial o registra un vecino ficticio.</li><li>En Nueva compra, agrega productos y confirma un crédito dentro de su línea disponible.</li><li>En Plan de pagos, compara cuotas semanales y mensuales.</li><li>Registra un pago completo o parcial y revisa el recibo, el saldo y los reportes.</li><li>Avanza la fecha desde Configuración para observar la mora.</li><li>Cierra sesión y entra como <b>maria / demo123</b> para ver la cuenta del cliente.</li></ol></section><section class="panel pad"><h2>Roles disponibles</h2>${table(['Función','Administrador','Cajero','Cliente'],[['Dashboard','✓','✓','Propio'],['Clientes y compras','✓','✓','Consulta propia'],['Registrar pagos','✓','✓','No'],['Simular planes','✓','✓','Sin registrar'],['Editar productos','✓','No','No'],['Reportes y configuración','✓','No','No']].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>'))}<p style="margin-top:15px">Administrador y cliente provienen del documento. El cajero es un rol adicional para representar la operación diaria. Los permisos y credenciales se simulan en JavaScript.</p></section><section class="panel pad"><h2>Criterios que requieren definición final</h2><p><b>Frecuencia.</b> La introducción exige cuotas mensuales; la tabla final menciona pagos semanales. Se ofrecen ambas opciones y se propone 12 semanas como punto de partida.</p><p><b>Plazo.</b> La tabla propone 90–120 días. El máximo de la demo es 120 días desde la compra, incluyendo gracia. Se puede reducir a 90 días; cada plan valida su último vencimiento.</p><p><b>Línea.</b> El análisis de entrada fija S/150–S/200, mientras la tabla final indica S/200–S/250. Se adopta S/150–S/200 para nuevos clientes.</p><p><b>Tasas.</b> Se toman del trabajo los límites académicos de 6.55% mensual compensatorio y 1.32% mensual moratorio. La demo usa TEM 3% y mora 1%. No se presentan como topes legales vigentes verificados.</p><p><b>Primer vencimiento.</b> Se conserva corte + 1–15 días. Como puede diferir del periodo semanal o mensual, se ajusta la cuota constante descontando cada vencimiento por sus días desde el corte. El interés de la primera fila corresponde exactamente a ese intervalo. Cuando los intervalos son iguales, coincide con la fórmula francesa ordinaria.</p></section><section class="panel pad"><h2>Motor financiero</h2><p>Mes comercial de 30 días y año de 360. La tasa ingresada se interpreta siempre como mensual. Capitalización nominal: 30 veces/mes (diaria), 1 (mensual) o 1/12 (anual).</p><div class="formula">TEM = (1 + TNM / m)^m − 1<br>TED = (1 + TEM)^(1/30) − 1<br>TEA = (1 + TEM)^12 − 1<br>TEP = (1 + TEM)^(d/30) − 1<br>Gracia = P × [(1 + TEM)^(g/30) − 1]<br>P' = P + Gracia<br>Cuota ordinaria = P' × i / [1 − (1+i)^(-n)]<br>Primer intervalo irregular:<br>Cuota = P' / Σ(1+TEM)^(-t_k/30)<br>t_k = días al primer pago + (k−1) × d<br>Interés = Saldo inicial × tasa del intervalo<br>Amortización = Cuota − Interés<br>Saldo final = Saldo inicial − Amortización</div><p style="margin-top:14px">d = 7 o 30 días; g = días comerciales hasta el corte; i = TEP. Para la gracia se usa diferencia 30/360 con días del mes limitados a 30. Las fechas semanales avanzan 7 días y las mensuales 30 días reales.</p><p><b>Mora:</b> saldo vencido impago × (tasa mensual / 30) × días reales de atraso. Cada abono deja de generar mora desde su fecha. No hay interés moratorio sobre la propia mora.</p><p><b>Redondeo:</b> cada fila se redondea a 2 decimales y la última cuota cancela el saldo residual. Cada cuota recibe primero el abono a su interés y después a su capital. La línea se libera únicamente por el capital amortizado. Al autorizar una compra se reserva el capital y la gracia capitalizada para no exceder la línea.</p></section><section class="panel pad"><h2>Relación con la imagen</h2><p>El cronograma replica las columnas N°, TEA, tasa efectiva del periodo, gracia, saldo inicial, interés, cuota, amortización y saldo final. Se agregan fecha de vencimiento, pagos y estado.</p><p>La imagen original es semestral y de un préstamo de S/1,440,000. No se usan esos importes para los vecinos: el cuadro se adapta al crédito minorista del documento.</p></section><section class="panel pad"><h2>Qué simula y qué falta para producción</h2><p>Este HTML funciona sin internet y guarda cambios con localStorage en el navegador. Puedes abrirlo en Chrome, Edge o Firefox. El botón Imprimir permite guardar un PDF del cronograma o comprobante.</p><p>No incorpora backend Java, SQL, autenticación segura, multiusuario real, cobros bancarios, envíos de mensajes ni comprobantes fiscales. Los nombres, DNI y teléfonos son ficticios.</p><p>Las compras de demostración se financian individualmente. Una versión transaccional deberá consolidar las compras abiertas por cliente al corte, gestionar reversos, prepago con recálculo, auditoría inalterable y consentimiento real.</p><p>La aplicación de pagos anticipados mantiene las cuotas pactadas: no se recalculan intereses futuros. Los abonos de este prototipo son aplicaciones a cuotas, no una liquidación financiera de prepago.</p></section></div>`}

function categories(){return [...new Set(db.products.map(p=>p.category))].sort()}
function nextProductId(){let n=1;while(db.products.some(p=>p.id==='P'+String(n).padStart(2,'0')))n++;return 'P'+String(n).padStart(2,'0')}
function filterCatalog(){let q=$('#sale-search').value.toLowerCase().trim(),category=$('#sale-category').value,count=0;document.querySelectorAll('#sale-products .product').forEach(p=>{p.hidden=!(p.dataset.name.toLowerCase().includes(q)&&(!category||p.dataset.category===category));if(!p.hidden)count++});$('#catalog-count').textContent=count+' productos coinciden con tu búsqueda';let empty=$('#sale-empty');if(empty)empty.remove();if(!count)$('#sale-products').insertAdjacentHTML('beforeend','<div class="empty-search" id="sale-empty">No encontramos productos con esos filtros.</div>')}
function purchaseRows(ls){return ls.map(l=>{let paid=db.payments.filter(p=>p.lid===l.id).reduce((s,p)=>s+p.amount,0);return `<tr><td><b>${l.id}</b><div class="subtle">${l.source==='simulation'?'Registro simulado':'Compra fiada'}</div></td><td>${date(l.start)}</td>${session.role!=='client'?`<td>${esc(client(l.cid).name)}</td>`:''}<td>${l.items.reduce((s,i)=>s+i.qty,0)} un. · ${l.items.length} artículos</td><td>${money(l.amount)}</td><td>${money(paid)}</td><td><b>${money(debt(l)+mora(l))}</b></td><td>${badge(status(l))}</td><td>${btn('Detalle',`purchaseDetail('${l.id}')`,'small')}</td></tr>`})}
function filteredPurchases(){let f=purchaseFilters;return visibleLoans().filter(l=>(session.role==='client'||!f.cid||l.cid===f.cid)&&(!f.state||status(l)===f.state)&&(!f.from||l.start>=f.from)&&(!f.to||l.start<=f.to)&&(!f.query||[l.id,client(l.cid).name,...l.items.map(i=>i.name)].join(' ').toLowerCase().includes(f.query.toLowerCase().trim()))).sort((a,b)=>b.start.localeCompare(a.start)||b.id.localeCompare(a.id))}
function purchaseResults(){let ls=filteredPurchases(),ids=new Set(ls.map(l=>l.id)),paid=db.payments.filter(p=>ids.has(p.lid)).reduce((s,p)=>s+p.amount,0);return `<div class="stats">${stat('Compras encontradas',ls.length,'Registros que coinciden con tus filtros')}${stat('Valor de productos',money(ls.reduce((s,l)=>s+l.amount,0)),'Antes del interés de financiamiento',true)}${stat('Abonos recibidos',money(paid),'Incluye inicial, cuotas y mora pagada')}${stat('Deuda actual',money(ls.reduce((s,l)=>s+debt(l)+mora(l),0)),'Pendiente de estas compras, con mora')}</div><section class="panel">${table(['Compra','Fecha',...(session.role!=='client'?['Cliente']:[]),'Productos','Venta','Abonado','Debe hoy','Estado',''],purchaseRows(ls))}</section><p class="subtle">El rango filtra la fecha de compra. Abonos y deuda corresponden al estado actual de esas compras. El interés de financiamiento explica la diferencia entre venta y total a pagar.</p>`}
function updatePurchaseFilters(){purchaseFilters={query:$('#purchase-query').value,cid:session.role==='client'?session.cid:$('#purchase-client').value,state:$('#purchase-state').value,from:$('#purchase-from').value,to:$('#purchase-to').value};$('#purchase-results').innerHTML=purchaseFilters.from&&purchaseFilters.to&&purchaseFilters.from>purchaseFilters.to?'<div class="notice warn">La fecha inicial debe ser anterior o igual a la final.</div>':purchaseResults()}
function purchasesView(){let f=purchaseFilters;return head(session.role==='client'?'Mis compras':'Historial de compras','Productos, importes, pagos y saldo de cada compra.',btn('Exportar detalle CSV','exportPurchases()'))+`<section class="panel"><div class="panel-head"><h2>Buscar compras</h2>${btn('Limpiar filtros',"purchaseFilters={query:'',cid:'',state:'',from:'',to:''};render()",'small')}</div><div class="purchase-filters"><label>Producto, cliente o código<input id="purchase-query" value="${esc(f.query)}" placeholder="Ej.: detergente" oninput="updatePurchaseFilters()"></label>${session.role!=='client'?`<label>Cliente<select id="purchase-client" onchange="updatePurchaseFilters()"><option value="">Todos</option>${db.clients.map(c=>option(c.id,c.name,f.cid)).join('')}</select></label>`:''}<label>Estado<select id="purchase-state" onchange="updatePurchaseFilters()"><option value="">Todos</option>${['Al día','En mora','Cancelado'].map(v=>option(v,v,f.state)).join('')}</select></label><label>Desde<input id="purchase-from" type="date" value="${esc(f.from)}" max="${db.today}" onchange="updatePurchaseFilters()"></label><label>Hasta<input id="purchase-to" type="date" value="${esc(f.to)}" max="${db.today}" onchange="updatePurchaseFilters()"></label></div></section><div id="purchase-results">${purchaseResults()}</div>`}
function purchaseDetail(id){let l=visibleLoans().find(l=>l.id===id);if(!l)return;let paid=db.payments.filter(p=>p.lid===id),initial=round(l.amount-l.principal),finance=round(l.total-l.principal);openModal('Compra '+id,`<div class="account-identity"><div><h2>${esc(client(l.cid).name)}</h2><p class="subtle">${date(l.start)} · ${l.source==='simulation'?'Registro de simulación':'Compra fiada de productos'}</p></div>${badge(status(l))}</div>${table(['Producto','Cantidad','Precio unitario','Subtotal'],l.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`),'detail-items')}<div class="summary-row"><span>Total de productos</span><b>${money(l.amount)}</b></div><div class="summary-row"><span>Inicial pagada</span><b>${money(initial)}</b></div><div class="summary-row"><span>Capital financiado</span><b>${money(l.principal)}</b></div><div class="summary-row"><span>Interés de gracia y cuotas</span><b>${money(finance)}</b></div><div class="summary-row"><span>Total contractual con inicial</span><b>${money(l.total+initial)}</b></div><div class="summary-row"><span>Abonos registrados (incluyen mora pagada)</span><b>${money(paid.reduce((s,p)=>s+p.amount,0))}</b></div><div class="summary-row"><span>Cuotas pendientes</span><b>${money(debt(l))}</b></div><div class="summary-row"><span>Mora pendiente</span><b>${money(mora(l))}</b></div><div class="summary-row"><span>Debe hoy</span><b style="color:var(--primary)">${money(debt(l)+mora(l))}</b></div><p class="subtle">${l.n} cuotas ${l.period===7?'semanales':'mensuales'} · TEM ${pct(l.im)} · Primero: ${date(l.rows[0].due)}.</p><div class="form-footer">${btn('Imprimir','window.print()')}${btn('Ver cronograma',`closeModal();showLoan('${id}')`,'primary')}</div>`)}
function accountView(){let cid=session.role==='client'?session.cid:selectedClient,c=client(cid)||db.clients[0],ls=visibleLoans().filter(l=>l.cid===c.id),ps=db.payments.filter(p=>p.cid===c.id).slice().sort((a,b)=>b.date.localeCompare(a.date)),balance=round(ls.reduce((s,l)=>s+debt(l),0)),penalty=round(ls.reduce((s,l)=>s+mora(l),0)),over=round(ls.reduce((s,l)=>s+late(l),0)),history=[...ls.map(l=>({date:l.start,title:'Compra '+l.id,detail:l.items.map(i=>i.qty+' × '+i.name).join(' · '),value:l.amount,type:'Valor de productos'})),...ps.map(p=>({date:p.date,title:'Pago '+p.id,detail:p.lid+' · '+p.method,value:p.amount,type:'Abono recibido'}))].sort((a,b)=>b.date.localeCompare(a.date));return head('Estado de cuenta','Todo el detalle financiero de un cliente, en un solo lugar.',btn('Exportar cuenta',`exportAccount('${c.id}')`)+btn('Imprimir','window.print()'))+`<section class="panel pad"><div class="account-identity">${person(c)}${session.role!=='client'?`<div class="account-selector"><label>Seleccionar cliente<select onchange="selectedClient=this.value;render()">${db.clients.map(x=>option(x.id,x.name,c.id)).join('')}</select></label></div>`:''}</div><div class="account-contact"><div><small>Teléfono</small><b>${c.phone}</b></div><div><small>Dirección</small><b>${esc(c.address)}</b></div><div><small>Compras / pagos</small><b>${ls.length} compras · ${ps.length} pagos</b></div><div><small>Línea / disponible</small><b>${money(c.limit)} / ${money(Math.max(0,c.limit-exposure(c.id)))}</b></div></div></section><div class="stats">${stat('Deuda total',money(balance+penalty),'Cuotas pendientes + mora',true)}${stat('Cuotas por vencer',money(balance-over),'Vencimiento hoy o posterior')}${stat('Cuotas vencidas',money(over),'No incluye mora adicional')}${stat('Mora pendiente',money(penalty),'Calculada al '+date(db.today))}</div><div class="tabs account-tabs">${[['account-purchases','Compras'],['account-payments','Pagos'],['account-timeline','Movimientos']].map(([id,label])=>btn(label,`document.getElementById('${id}').scrollIntoView({behavior:'smooth'})`)).join('')}</div><section class="panel account-section" id="account-purchases"><div class="panel-head"><h2>Compras del cliente</h2></div>${table(['Compra','Fecha',...(session.role!=='client'?['Cliente']:[]),'Productos','Venta','Abonado','Debe hoy','Estado',''],purchaseRows(ls.slice().sort((a,b)=>b.start.localeCompare(a.start))))}</section><section class="panel account-section" id="account-payments"><div class="panel-head"><h2>Historial de pagos</h2><span class="badge gray">Total abonado: ${money(ps.reduce((s,p)=>s+p.amount,0))}</span></div>${table(['Recibo','Compra','Fecha','Medio','Abono','Mora incluida',''],ps.map(p=>`<tr><td>${p.id}</td><td>${p.lid}</td><td>${date(p.date)}</td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td>${money(p.mora)}</td><td>${btn('Recibo',`receipt('${p.id}')`,'small')}</td></tr>`))}</section><section class="panel pad account-section" id="account-timeline"><h2>Movimientos de la cuenta</h2><p class="subtle">Ordenados por fecha. Las compras muestran el valor de productos; los abonos incluyen interés y mora cuando corresponda.</p><div class="timeline">${history.map(x=>`<p><b>${x.title} · ${money(x.value)}</b><small>${date(x.date)} · ${x.type}</small><span style="display:block;font-size:13px;color:var(--muted);margin-top:5px">${esc(x.detail)}</span></p>`).join('')||'<p>Este cliente todavía no tiene movimientos.</p>'}</div></section>`}
function exportPurchases(){if(purchaseFilters.from&&purchaseFilters.to&&purchaseFilters.from>purchaseFilters.to)return toast('Corrige el rango de fechas.');csv('Compras-Bodega-Moran.csv',['Compra','Fecha','Cliente','Producto','Cantidad','Precio unitario','Subtotal'],filteredPurchases().flatMap(l=>l.items.map(i=>[l.id,l.start,client(l.cid).name,i.name,i.qty,i.price,round(i.qty*i.price)])))}
function exportAccount(cid){if(session.role==='client'&&cid!==session.cid)return;let ls=visibleLoans().filter(l=>l.cid===cid);csv('Estado-cuenta-'+cid+'.csv',['Cliente','Compra','Fecha','Venta','Inicial','Capital','Interes contractual','Total contractual con inicial','Abonos con mora','Cuotas pendientes','Mora pendiente','Deuda total'],ls.map(l=>[client(cid).name,l.id,l.start,l.amount,round(l.amount-l.principal),l.principal,round(l.total-l.principal),round(l.total+l.amount-l.principal),round(db.payments.filter(p=>p.lid===l.id).reduce((s,p)=>s+p.amount,0)),debt(l),mora(l),round(debt(l)+mora(l))]))}
function stockState(p){return p.stock===0?'Agotado':p.stock<10?'Stock bajo':'Disponible'}
function filterProducts(){let query=$('#product-query').value.toLowerCase().trim(),cat=$('#product-category').value,state=$('#product-state').value,ps=db.products.filter(p=>(p.name+' '+p.id).toLowerCase().includes(query)&&(!cat||p.category===cat)&&(!state||stockState(p)===state));$('#product-table').innerHTML=productsTable(ps);$('#product-count').textContent=ps.length+' productos'}
function productsTable(ps){return table(['Producto','Categoría','Contado','Al crédito','Stock','Estado',...(session.role==='admin'?['Acciones']:[])],ps.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="subtle">${p.id}</div></td><td>${esc(p.category)}</td><td>${money(p.cash)}</td><td>${money(p.credit)}</td><td>${p.stock}</td><td><span class="badge ${p.stock===0?'red':p.stock<10?'amber':''}">${stockState(p)}</span></td>${session.role==='admin'?`<td><div class="actions">${btn('Editar',`productModal('${p.id}')`,'small')}${btn('Reponer',`restockModal('${p.id}')`,'small')}</div></td>`:''}</tr>`))}
function restockModal(id){if(session.role!=='admin')return;let p=db.products.find(p=>p.id===id);openModal('Reponer inventario',`<p><b>${esc(p.name)}</b><br><span class="subtle">Stock actual: ${p.stock} unidades.</span></p><form onsubmit="restock(event,'${id}')"><label>Unidades a ingresar<input name="qty" type="number" step="1" min="1" max="10000" value="10" required></label><label style="margin-top:16px">Motivo o referencia<input name="reason" maxlength="100" value="Reposición de proveedor" required></label><div class="form-footer">${btn('Cancelar','closeModal()')}<button class="primary">Confirmar reposición</button></div></form>`)}
function restock(e,id){e.preventDefault();if(session.role!=='admin')return;let f=Object.fromEntries(new FormData(e.target)),qty=+f.qty,p=db.products.find(p=>p.id===id);if(!p||!Number.isInteger(qty)||qty<1||qty>10000||!f.reason.trim())return toast('Revisa la cantidad y el motivo.');p.stock+=qty;db.inventory.unshift({date:db.today,pid:id,name:p.name,delta:qty,reason:f.reason.trim(),user:session.name});save('Reposición de '+qty+' unidades: '+p.name);closeModal();render();toast('Inventario actualizado.')}
function inventoryTable(){return table(['Fecha','Producto','Movimiento','Motivo','Usuario'],db.inventory.slice(0,20).map(m=>`<tr><td>${date(m.date)}</td><td>${esc(m.name)}</td><td class="inventory-sign">${m.delta>0?'+':''}${m.delta} un.</td><td>${esc(m.reason)}</td><td>${esc(m.user)}</td></tr>`))}
function categorySales(){let totals={};for(let l of db.loans)for(let i of l.items){let c=i.category||'Sin detalle de categoría';totals[c]=(totals[c]||0)+i.price*i.qty}let rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...rows.map(x=>x[1]));return `<section class="panel pad"><h2>Compras financiadas por categoría</h2><p class="subtle">Valor de productos, sin interés · Historial completo</p>${rows.map(([c,v])=>`<div class="category-row"><span>${esc(c)}</span><div class="bar"><i style="width:${100*v/max}%"></i></div><b>${money(v)}</b></div>`).join('')||'<div class="empty">Todavía no hay compras.</div>'}</section>`}
function inventorySummary(){let low=db.products.filter(p=>p.stock<10).sort((a,b)=>a.stock-b.stock);return `<section class="panel"><div class="panel-head"><div><h2>Productos por reponer</h2><p>Menos de 10 unidades · ${low.length} productos</p></div>${btn('Ver catálogo',"go('products')",'small')}</div>${table(['Producto','Stock','Estado'],low.slice(0,6).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td><span class="badge ${p.stock===0?'red':'amber'}">${stockState(p)}</span></td></tr>`))}</section>`}

function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(name,headers,rows){let cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download(name,'\ufeff'+[headers,...rows].map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function exportSchedule(id){let l=loan(id);if(!visibleLoans().includes(l))return;exportCalc(l,id)}
function exportSimulation(){if(simulation)exportCalc(simulation,'Simulacion')}
function exportCalc(l,name){let rows=l.rows.map(r=>[r.n,r.due,pct(l.tea),pct(r.ip??l.ip),'Sin gracia',r.start.toFixed(2),r.interest.toFixed(2),r.payment.toFixed(2),r.amort.toFixed(2),r.end.toFixed(2),(r.paid||0).toFixed(2)]);if(l.gdays>0)rows.unshift([0,l.cut,pct(l.tea),pct(Math.pow(1+l.im,l.gdays/30)-1),'Total',l.principal,l.gi,0,0,l.financed,0]);csv('Plan-'+name+'.csv',['Cuota','Vencimiento','TEA','TEP','Gracia','Saldo inicial','Interes','Cuota','Amortizacion','Saldo final','Pagado'],rows);toast('Cronograma exportado.')}
function exportPayments(){let ids=visibleLoans().map(l=>l.id);csv('Pagos-Bodega-Moran.csv',['Recibo','Credito','Cliente','Fecha','Medio','Monto','Mora'],db.payments.filter(p=>ids.includes(p.lid)).map(p=>[p.id,p.lid,client(p.cid).name,p.date,p.method,p.amount,p.mora]))}
function exportReport(){if(session.role!=='admin')return;csv('Cartera-Bodega-Moran.csv',['Cliente','DNI','Linea','Capital usado','Creditos','Pagos','Cuotas pendientes','Mora'],db.clients.map(c=>{let ll=db.loans.filter(l=>l.cid===c.id);return [c.name,c.dni,c.limit,exposure(c.id),ll.length,db.payments.filter(p=>p.cid===c.id).length,round(ll.reduce((s,l)=>s+debt(l),0)),round(ll.reduce((s,l)=>s+mora(l),0))]}))}
